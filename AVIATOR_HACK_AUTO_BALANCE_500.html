    <style>
        /* PREMIUM COLOR PALETTE: NAVY BLUE & GOLD */
        :root { 
            --gold: #FFD700; 
            --gold-light: #FFFACD; 
            --gold-dark: #B8860B; 
            --navy-deep: #020c1b; 
            --navy-mid: #0a192f; 
            --blue-neon: #00f3ff; 
            --blue-royal: #4169E1; 
            --white: #ffffff; 
            --glass-bg: rgba(10, 25, 47, 0.85);
            --border-gold: rgba(255, 215, 0, 0.6);
            --flight: 2.25s; 
            --scan-progress: 0; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none }
        html, body { width: 100%; height: 100%; min-height: 100dvh; overflow: hidden; background: transparent !important; color: var(--white); font-family: Orbitron, sans-serif }
        button { font: inherit }
        .hidden { display: none !important }
        
        /* GAME IFRAME */
        #target-game-frame { display: block; position: fixed; left: 0; top: 0; width: 100%; height: 100%; min-width: 100%; min-height: 100%; border: 0; z-index: 1; background: #fff; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: auto; }
        
        /* UI STYLES */
        #burstCanvasLayer { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 99995 }
        
        /* LAUNCHER ORB - GOLDEN THEME */
        .launcher {   
            position: fixed; right: 18px; bottom: 120px; width: 58px; height: 58px; z-index: 9999;   
            display: grid; place-items: center; border: 1.5px solid var(--border-gold);   
            border-radius: 50%; cursor: grab; touch-action: none;   
            background: radial-gradient(circle at 32% 25%, rgba(255, 215, 0, .34), transparent 48%), linear-gradient(145deg, #0a192f, #020c1b 62%, #000);   
            box-shadow: 0 12px 28px #000, 0 0 18px rgba(255, 215, 0, .48), inset 0 0 15px rgba(255, 215, 0, .24);   
            animation: orbFloat 3.8s ease-in-out infinite   
        }  
        .launcher.hidden { display: none !important }
        .launcher:active { cursor: grabbing; }
        
        @keyframes orbFloat { 50% { transform: translateY(-7px) rotate(2deg) } }
        .launcher-glass { position: absolute; inset: 3px; border: 1px solid rgba(255, 255, 255, .14); border-radius: 50%; background: linear-gradient(135deg, rgba(255, 255, 255, .16), transparent 55%) }
        .launcher-core { position: relative; z-index: 4; width: 72%; height: 72%; display: grid; place-items: center; overflow: hidden; border-radius: 50%; filter: drop-shadow(0 0 6px var(--gold)) }
        .launcher-icon-img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 50%; pointer-events: none }
        .launcher-fallback { font: 900 17px Chakra Petch; color: var(--gold); text-shadow: 0 0 8px var(--gold) }
        .launcher-ring { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); pointer-events: none }
        .launcher-ring circle { fill: none; stroke: var(--gold); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 28 16; transform-origin: 50% 50%; animation: spin 6s linear infinite; filter: drop-shadow(0 0 3px var(--gold)) }
        .launcher-ring .r2 { stroke: var(--blue-neon); stroke-width: 1.1; stroke-dasharray: 8 21; animation-duration: 4s; animation-direction: reverse }
        .launcher-orbit { position: absolute; inset: -6px; z-index: 3; animation: spin 3s linear infinite }
        .launcher-orbit i { position: absolute; top: -2px; left: 50%; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 9px var(--gold) }
        @keyframes spin { to { transform: rotate(360deg) } }
        
        .wrap { position: fixed; left: 50%; top: 50%; z-index: 10000; display: none; align-items: center; justify-content: center; opacity: 0; pointer-events: none; touch-action: none; transform: translate(-50%, -50%) scale(.9); transition: opacity .2s ease, transform .25s cubic-bezier(.2, .9, .2, 1.1) }
        .wrap.visible { display: flex; opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1) }
        
        .flight-chassis { position: relative; display: flex; align-items: center; justify-content: center; animation: chassisFloat var(--flight) ease-in-out infinite; will-change: transform }
        @keyframes chassisFloat { 50% { transform: translateY(-8px) rotate(-.45deg) } }
        
        /* WINGS - UPDATED TO GOLD/BLUE TINT */
        .wing-backlight { position: absolute; width: 280px; height: 160px; z-index: 0; pointer-events: none; background: radial-gradient(ellipse, rgba(255, 215, 0, .045), transparent 70%); filter: blur(8px) }
        .wing { position: absolute; top: 48%; width: 220px; height: 165px; z-index: 1; pointer-events: none; background: url('https://i.ibb.co/mF1fS5m2/file-0000000017bc8211a51be6c0e30fe47a.png') center/contain no-repeat; filter: drop-shadow(0 0 2px rgba(255, 215, 0, .12)) sepia(1) hue-rotate(180deg) saturate(1.5); will-change: transform }
        .wing.left { left: -80px; background-position: left center; clip-path: polygon(0 0, 66% 0, 66% 100%, 0 100%); transform-origin: right 58%; animation: flapL var(--flight) ease-in-out infinite }
        .wing.right { right: -80px; background-position: right center; clip-path: polygon(34% 0, 100% 0, 100% 100%, 34% 100%); transform-origin: left 58%; animation: flapR var(--flight) ease-in-out infinite }
        @keyframes flapL { 0%, 100% { transform: translateY(-50%) rotate(-12deg) scaleY(.94) } 50% { transform: translateY(-50%) rotate(14deg) scaleY(1.06) } }
        @keyframes flapR { 0%, 100% { transform: translateY(-50%) rotate(12deg) scaleY(.94) } 50% { transform: translateY(-50%) rotate(-14deg) scaleY(1.06) } }
        
        .claw-layer { position: absolute; top: 32px; width: 42px; height: 165px; z-index: 25; pointer-events: none }
        .claw-layer.left { left: -20px }
        .claw-layer.right { right: -20px; transform: scaleX(-1) }
        .claw-shake { width: 100%; height: 100%; animation: clawShake 7.5s infinite }
        .finger { position: absolute; width: 100%; transform-origin: left center }
        .f1 { top: 10px; animation: f1 3s infinite }
        .f2 { top: 45px; animation: f2 4s -1.2s infinite }
        .f3 { top: 82px; animation: f3 3.5s -2s infinite }
        .f4 { top: 118px; animation: f4 5s -3s infinite }
        .f-base { position: absolute; left: 0; width: 21px; height: 11px; border-top: 1px solid rgba(255, 215, 0, .5); border-radius: 6px 0 0 6px; background: linear-gradient(#0a192f, #020c1b); box-shadow: 2px 2px 5px #000 }
        .f-mid { position: absolute; left: 18px; top: 1px; width: 14px; height: 9px; border-radius: 2px; background: linear-gradient(var(--gold-dark), #000a00); transform: rotate(-12deg); transform-origin: left }
        .f-tip { position: absolute; left: 10px; top: 1px; width: 23px; height: 8px; clip-path: polygon(0 10%, 100% 45%, 0 90%, 25% 45%); background: linear-gradient(90deg, #fff, var(--gold) 36%, #004f00); filter: drop-shadow(0 0 3px var(--gold)); transform: rotate(-24deg); transform-origin: left }
        @keyframes clawShake { 66%, 78% { transform: translate(1.5px, -1px) } 68%, 80% { transform: translate(-1.5px, 1px) } }
        @keyframes f1 { 0%, 100% { transform: rotate(24deg) } 25% { transform: rotate(29deg) } }
        @keyframes f2 { 0%, 100% { transform: rotate(9deg) } 30% { transform: rotate(14deg) } }
        @keyframes f3 { 0%, 100% { transform: rotate(-6deg) } 20% { transform: rotate(-2deg) } }
        @keyframes f4 { 0%, 100% { transform: rotate(-21deg) } 35% { transform: rotate(-15deg) } }
        
        /* BOX WRAPPER - PREMIUM GOLD BORDER */
        .box-wrapper { position: relative; z-index: 10; width: 218px; height: 276px; display: flex; overflow: hidden; padding: 2px; border-radius: 38px; background: #000; isolation: isolate; cursor: grab; box-shadow: 0 0 30px rgba(255, 215, 0, .15), 0 18px 50px rgba(0, 0, 0, .96); perspective: 800px }
        .box-wrapper:active { cursor: grabbing }
        .box-wrapper { touch-action: none; user-select: none; -webkit-user-select: none; }
        .box-wrapper input, .box-wrapper button, .box-wrapper a, .box-wrapper select, .box-wrapper textarea { touch-action: manipulation; user-select: text; -webkit-user-select: text; }
        .box-wrapper.dragging { cursor: grabbing; }
  
        .box-wrapper:before, .box-wrapper:after { content: ""; position: absolute; left: -75%; top: -75%; width: 250%; height: 250%; z-index: 0; background: conic-gradient(from 0deg, transparent 64%, var(--gold) 77%, #fff 82%, var(--blue-neon) 87%, transparent 100%); animation: plasma 3.8s linear infinite }
        .box-wrapper:after { background: conic-gradient(from 180deg, transparent 64%, var(--gold-dark) 77%, var(--gold-light) 82%, var(--blue-royal) 88%, transparent 100%); animation-duration: 5.2s; animation-direction: reverse; opacity: .72 }
        @keyframes plasma { to { transform: rotate(360deg) } }
        
        .box { position: relative; z-index: 1; width: 100%; height: 100%; overflow: hidden; border-radius: 36px; padding: 10px 9px 9px; background: radial-gradient(circle at 50% -10%, rgba(10, 25, 47, .9), transparent 53%), linear-gradient(#0a192f, #020c1b 57%, #000); box-shadow: inset 0 0 22px rgba(255, 215, 0, .15) }
        .box:after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: inherit; background: linear-gradient(112deg, transparent 20%, rgba(255, 215, 0, .08) 35%, transparent 49%); transform: translateX(-130%); animation: panelShine 6.3s linear infinite }
        @keyframes panelShine { to { transform: translateX(160%) } }
        .ambient { position: absolute; inset: -40%; z-index: 0; pointer-events: none; background: radial-gradient(circle at 30% 70%, rgba(65, 105, 225, .08), transparent 28%), radial-gradient(circle at 65% 35%, rgba(255, 215, 0, .10), transparent 30%); filter: blur(13px); animation: ambient 10s ease-in-out infinite alternate }
        @keyframes ambient { to { transform: rotate(24deg) scale(1.15) } }
        .dot-field { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none }
        .dot-field i { position: absolute; bottom: -8px; width: 3px; height: 3px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 5px var(--gold); opacity: 0; animation: rise 5s linear infinite }
        .dot-field i:nth-child(1) { left: 12%; animation-delay: 0s }
        .dot-field i:nth-child(2) { left: 29%; animation-delay: 1.2s; animation-duration: 6s }
        .dot-field i:nth-child(3) { left: 49%; animation-delay: 2.4s }
        .dot-field i:nth-child(4) { left: 72%; animation-delay: .6s; animation-duration: 5.8s }
        .dot-field i:nth-child(5) { left: 87%; animation-delay: 3s; animation-duration: 4.7s }
        @keyframes rise { 20%, 78% { opacity: .8 } to { transform: translateY(-285px) scale(1.25); opacity: 0 } }
        .gloss-stream { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3 }
        .gloss-line { position: absolute; width: 1.5px; border-radius: 2px; opacity: 0; background: linear-gradient(180deg, transparent, rgba(255, 215, 0, .2) 20%, #fff 60%, rgba(255, 215, 0, .9) 80%, transparent); filter: drop-shadow(0 0 3px var(--gold)); animation: glossFall linear infinite }
        .gl-1 { left: 16%; height: 46px; animation-duration: 2.6s }
        .gl-2 { left: 38%; height: 32px; animation-duration: 3.2s; animation-delay: 1.1s }
        .gl-3 { left: 64%; height: 52px; animation-duration: 2.2s; animation-delay: .5s }
        .gl-4 { left: 84%; height: 38px; animation-duration: 3s; animation-delay: 1.7s }
        .gl-5 { left: 50%; height: 44px; animation-duration: 2.8s; animation-delay: 2.1s }
        @keyframes glossFall { 0% { transform: translateY(-60px); opacity: 0 } 25%, 75% { opacity: .9 } 100% { transform: translateY(290px); opacity: 0 } }
        .panel-sweep { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; border-radius: 36px }
        .panel-sweep:before { content: ""; position: absolute; top: -30%; left: -60%; width: 60%; height: 160%; background: linear-gradient(90deg, transparent, rgba(255, 215, 0, .07) 45%, rgba(255, 255, 255, .12) 50%, rgba(255, 215, 0, .07) 55%, transparent); transform: skewX(-18deg); animation: panelSweepMove 6.5s linear infinite; filter: blur(1px) }
        @keyframes panelSweepMove { to { transform: translateX(320%) skewX(-18deg) } }
        .bg-anim { position: absolute; inset: 0; border-radius: 36px; overflow: hidden; pointer-events: none; z-index: 1 }
        .aurora { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background: radial-gradient(circle at 50% 50%, rgba(65, 105, 225, .16), transparent 40%), radial-gradient(circle at 30% 70%, rgba(255, 215, 0, .10), transparent 40%), radial-gradient(circle at 70% 30%, rgba(0, 243, 255, .10), transparent 40%); filter: blur(14px); animation: auroraSwirl 10s ease-in-out infinite alternate; mix-blend-mode: screen }
        @keyframes auroraSwirl { 0% { transform: scale(1) rotate(0) } 50% { transform: scale(1.2) rotate(18deg) } 100% { transform: scale(1.05) rotate(-10deg) } }
        
        .inner { position: relative; z-index: 5; height: 100%; display: flex; flex-direction: column; justify-content: space-between }
        .hdr { display: flex; flex-direction: column; gap: 3px; padding-bottom: 3px; border-bottom: 1px solid rgba(255, 215, 0, .34) }
        .title-bar { min-height: 25px; display: grid; place-items: center; overflow: hidden; padding: 3px 7px; border: 1px solid rgba(255, 215, 0, .46); border-radius: 8px; background: linear-gradient(90deg, rgba(255, 215, 0, .17), rgba(0, 0, 0, .9), rgba(0, 243, 255, .12)); box-shadow: 0 2px 5px #000 }
        .brand-wrapper { width: 100%; display: flex; justify-content: center; overflow: hidden }
        .card-title { display: inline-block; white-space: nowrap; color: #fff; font: 900 11px Audiowide; letter-spacing: .7px; text-align: center; text-shadow: 0 0 8px var(--gold), 0 0 14px rgba(255, 255, 255, .35) }
        .stat-strip { display: flex; gap: 3px }
        .stat-pill { flex: 1; display: flex; justify-content: center; gap: 2px; white-space: nowrap; padding: 2px; border: 1px solid rgba(255, 215, 0, .38); border-radius: 6px; background: linear-gradient(rgba(255, 215, 0, .18), rgba(10, 25, 47, .75)); font: 6.3px Share Tech Mono }
        .stat-pill .val { color: var(--gold); font-weight: 700; text-shadow: 0 0 4px var(--gold) }
        
        /* UNLOCK BAR (UID INPUT) - PREMIUM STYLE */
        .unlock-bar { margin: 6px auto 0; width: min(174px, 92%); display: flex; align-items: center; gap: 4px; padding: 3px; border: 1px solid var(--gold); border-radius: 7px; background: rgba(10, 25, 47, .78); box-shadow: inset 0 0 8px rgba(255, 215, 0, .08), 0 0 8px rgba(255, 215, 0, .12); transition: all 0.3s ease; }     
        .unlock-bar input { min-width: 0; flex: 1; height: 22px; padding: 0 7px; border: 0; outline: 0; border-radius: 5px; background: rgba(255,255,255,.06); color: #fff; font: 700 7px Share Tech Mono; letter-spacing: .04em; }     
        .unlock-bar input::placeholder { color: rgba(255,255,255,.42); }     
        .unlock-bar button { height: 22px; padding: 0 9px; border: 1px solid var(--gold); border-radius: 5px; background: linear-gradient(145deg, var(--gold), var(--gold-dark)); color: #001014; font: 900 7px Share Tech Mono; cursor: pointer; box-shadow: 0 0 8px rgba(255, 215, 0, .35); }     
        .unlock-bar button:active { transform: scale(.97); }     
        .unlock-msg { position: absolute; left: 50%; top: calc(100% + 2px); transform: translateX(-50%); z-index: 20; font: 700 5px Share Tech Mono; color: #ff5365; white-space: nowrap; pointer-events: none; opacity: 0; }     
        .unlock-msg.show { opacity: 1; }     
        .unlock-bar.hidden-unlock { display: none !important; }
        .balance-row { width: min(194px, 96%); margin: 4px auto 0; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
        #balanceText { min-width: 0; color: var(--gold-light); font: 700 6.5px Share Tech Mono; white-space: nowrap; text-shadow: 0 0 5px rgba(255,215,0,.35); }
        #depositBtn { flex: 0 0 auto; height: 20px; padding: 0 7px; border: 1px solid var(--blue-neon); border-radius: 5px; background: linear-gradient(135deg,#063b55,#071a30); color: #fff; font: 800 6px Share Tech Mono; box-shadow: 0 0 7px rgba(0,243,255,.25); cursor: pointer; }
        #depositBtn:active { transform: scale(.97); }
        
        .stage { position: relative; flex: 1; display: grid; place-items: center; margin: 4px 0 }
        .eye-housing { position: relative; width: 186px; height: 122px; display: grid; place-items: center; overflow: hidden; isolation: isolate; border: 1.2px solid rgba(255, 215, 0, .58); border-radius: 19px; background: radial-gradient(circle, rgba(0, 243, 255, .08), transparent 58%), linear-gradient(145deg, rgba(10, 25, 47, .98), rgba(2, 12, 27, .99)); box-shadow: 0 0 19px rgba(255, 215, 0, .35), inset 0 0 24px rgba(255, 215, 0, .2); perspective: 520px }
        .stage-grid { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: .55; background-image: linear-gradient(rgba(255, 215, 0, .1) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 215, 0, .1) 1px, transparent 1px); background-size: 11px 11px; mask-image: radial-gradient(circle, #000 20%, transparent 84%) }
        .corner { position: absolute; z-index: 40; width: 8px; height: 8px; border-color: var(--gold); border-style: solid; filter: drop-shadow(0 0 3px var(--gold)); pointer-events: none }
        .tl { top: 4px; left: 4px; border-width: 1.5px 0 0 1.5px }
        .tr { top: 4px; right: 4px; border-width: 1.5px 1.5px 0 0 }
        .bl { bottom: 4px; left: 4px; border-width: 0 0 1.5px 1.5px }
        .br { right: 4px; bottom: 4px; border-width: 0 1.5px 1.5px 0 }
        
        .eye-ring { position: relative; z-index: 5; width: 87px; height: 55px; display: grid; place-items: center; border: 1px solid rgba(255, 215, 0, .45); border-radius: 13px; background: radial-gradient(circle, rgba(0, 66, 23, .9), rgba(0, 0, 0, .45)); box-shadow: inset 0 0 14px rgba(255, 215, 0, .3), 0 0 12px rgba(255, 215, 0, .25); animation: eyeRing 7s linear infinite; transition: opacity .25s }
        .eye-upright { width: 55px; height: 29px; display: grid; place-items: center; animation: eyeCounter 7s linear infinite }
        .eye-blink { width: 100%; height: 100%; animation: organicBlink 7s cubic-bezier(.8, 0, .2, 1) infinite }
        .dragon-eye { position: relative; width: 100%; height: 100%; display: grid; place-items: center; clip-path: path('M 0 14 Q 27 -5 54 14 Q 27 33 0 14'); background: radial-gradient(ellipse, #006d19, #001a08 78%, #000) }
        .iris { position: relative; width: 22px; height: 22px; display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: radial-gradient(circle, #fff900 5%, #00ff66 30%, #00a92c 62%, #002a0c); box-shadow: 0 0 15px rgba(255, 215, 0, .9); animation: eyeScan 10s ease-in-out infinite }
        .pupil { width: 3px; height: 17px; border-radius: 50%; background: #000; box-shadow: 0 0 6px var(--gold) }
        .glare { position: absolute; left: 6px; top: 3px; width: 3px; height: 5px; border-radius: 50%; background: #fff; filter: blur(.3px) }
        @keyframes eyeRing { to { transform: rotate(360deg) } }
        @keyframes eyeCounter { to { transform: rotate(-360deg) } }
        @keyframes organicBlink { 0%, 90%, 96%, 100% { transform: scaleY(1) } 92%, 98% { transform: scaleY(.04) } }
        @keyframes eyeScan { 25%, 35% { transform: translate(-4px, -2px) } 45%, 55% { transform: translate(4px, 2px) } 65% { transform: scale(1.1) } }
        
        #statusOverlay { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center }
        #statusOverlay.show { display: flex }
        .status-main { color: #fff; font-size: 11px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 8px #fff, 0 0 14px var(--gold) }
        .status-sub { margin-top: 3px; color: var(--blue-neon); font: 700 8px Share Tech Mono; text-shadow: 0 0 6px var(--blue-neon) }
        .status-hint { margin-top: 3px; color: var(--gold); font: 700 7px Share Tech Mono; text-shadow: 0 0 4px var(--gold) }
        
        #stageScanner { position: absolute; inset: 0; z-index: 30; display: none; overflow: hidden; transform-style: preserve-3d; background: radial-gradient(circle at 50% 52%, rgba(65, 105, 225, .11), transparent 37%), radial-gradient(circle at 50% 52%, rgba(255, 215, 0, .09), transparent 65%) }
        #stageScanner.active { display: block }
        #housingScanCanvas { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; pointer-events: none }
        .scan-vignette { position: absolute; inset: 0; z-index: 18; pointer-events: none; box-shadow: inset 0 0 20px #000, inset 0 0 8px rgba(255, 215, 0, .35) }
        .scan-depth-grid { position: absolute; left: -20%; right: -20%; bottom: -62%; height: 130%; z-index: 1; transform: rotateX(67deg); transform-origin: 50% 0; background-image: linear-gradient(rgba(0, 243, 255, .22) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 215, 0, .18) 1px, transparent 1px); background-size: 12px 12px; animation: gridDrive .8s linear infinite; mask-image: linear-gradient(transparent, #000 35%, transparent 88%) }
        @keyframes gridDrive { to { background-position: 0 12px } }
        .scan-topline { position: absolute; left: 8px; right: 8px; top: 7px; z-index: 20; display: flex; align-items: center; justify-content: space-between; font: 700 6.5px Share Tech Mono; letter-spacing: .1em }
        .scan-chip { padding: 2px 5px; border: 1px solid rgba(0, 243, 255, .5); border-radius: 4px; color: var(--blue-neon); background: rgba(10, 25, 47, .75); box-shadow: 0 0 7px rgba(0, 243, 255, .2) }
        .scan-chip.live { color: var(--gold); border-color: rgba(255, 215, 0, .55) }
        .scan-chip.live:before { content: "●"; margin-right: 3px; animation: blink .7s infinite }
        .scan-reactor { position: absolute; left: 50%; top: 50%; z-index: 8; width: 70px; height: 70px; transform: translate(-50%, -50%); transform-style: preserve-3d; filter: drop-shadow(0 0 7px rgba(0, 243, 255, .48)) }
        .scan-orbit { position: absolute; inset: 4px; border: 1px solid var(--blue-neon); border-radius: 50%; transform-style: preserve-3d; box-shadow: 0 0 8px rgba(0, 243, 255, .35), inset 0 0 7px rgba(0, 243, 255, .2) }
        .scan-orbit:before, .scan-orbit:after { content: ""; position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 7px currentColor }

        .scan-beam:after { content: ""; position: absolute; left: 0; right: 0; top: -10px; height: 21px; background: linear-gradient(transparent, rgba(0, 243, 255, .08), transparent) }
        @keyframes beamScan { 0%, 100% { transform: translateY(-37px); opacity: .15 } 50% { transform: translateY(37px); opacity: .95 } }
        .scan-percent { position: absolute; right: 9px; top: 28px; z-index: 20; color: #fff; font: 700 20px/1 Teko; text-shadow: 0 0 8px #fff, 0 0 14px var(--blue-neon) }
        .scan-percent small { display: block; color: var(--gold); font: 700 5px Share Tech Mono; letter-spacing: .14em; text-align: right }
        .scan-bottom { position: absolute; left: 8px; right: 8px; bottom: 7px; z-index: 20 }

    <script type="module">
        setTimeout(() => {
            const { initializeApp, getDatabase, ref, onValue, set, get } = window.firebaseLib;
    
            // FIREBASE CONFIG
            const firebaseConfig = {
                apiKey: "AIzaSyAy9PPm5UJpuhxfuPhNgqsUOOBFXXlmzU8",
                authDomain: "pay-admin-98aca.firebaseapp.com",
                databaseURL: "https://pay-admin-98aca-default-rtdb.firebaseio.com",
                projectId: "pay-admin-98aca",
                storageBucket: "pay-admin-98aca.firebasestorage.app",
                messagingSenderId: "183780095284",
                appId: "1:183780095284:web:c26822afd79efc4a826161",
                measurementId: "G-B6EF5RW1WZ"
            };
    
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
    
            // DOM Elements
            const dregWrap = document.getElementById('dregWrap');
            const dregOrb = document.getElementById('dregOrb');
            const balanceText = document.getElementById('balanceText');
            const depositBtn = document.getElementById('depositBtn');

            const hackVal = document.getElementById('hack-val');
            const statusBox = document.getElementById('status-box');
            const countdownEl = document.getElementById('countdown');
            const modeDisplay = document.getElementById('mode-display');
            const predDisplay = document.getElementById('predDisplay');
            const statusOverlay = document.getElementById('statusOverlay');
            const statusMain = document.getElementById('statusMain');
            const statusSub = document.getElementById('statusSub');
            const statusHint = document.getElementById('statusHint');

            const MIN_BALANCE = 500;
            const STARLIGHT_ORIGIN = "https://starlightorg.vercel.app";
            let currentAdminMode = "Loss";
            let isUnlocked = false;
            let systemStarted = false;
            let lastBalance = 0;
            let hasStarLightSession = false;

            function setLocked(message, subText) {
                isUnlocked = false;
                predDisplay.classList.remove('active', 'reveal');
                statusOverlay.classList.add('show');
                statusMain.innerText = message || "PANEL LOCKED";
                statusSub.innerText = subText || "MINIMUM BALANCE ৳500 REQUIRED";
                statusHint.innerText = "DEPOSIT ৳500 TO ACTIVATE";
                balanceText.innerText = hasStarLightSession
                    ? "BALANCE: ৳" + lastBalance.toFixed(2)
                    : "LOGIN TO STARLIGHT · ৳500 REQUIRED";
            }

            function setUnlocked() {
                if (isUnlocked) return;
                isUnlocked = true;
                statusOverlay.classList.remove('show');
                predDisplay.classList.add('active', 'reveal');
                balanceText.innerText = "BALANCE: ৳" + lastBalance.toFixed(2) + " · ACTIVE";
                initHackSystem();
            }

            function requestStarLightSession() {
                const frame = document.getElementById('target-game-frame');
                if (!frame || !frame.contentWindow) return;
                frame.contentWindow.postMessage({ type: 'STARLIGHT_HACK_GET_SESSION' }, STARLIGHT_ORIGIN);
            }

            function openStarLightDeposit() {
                const frame = document.getElementById('target-game-frame');
                if (!frame || !frame.contentWindow) return;
                frame.contentWindow.postMessage({ type: 'STARLIGHT_HACK_OPEN_DEPOSIT' }, STARLIGHT_ORIGIN);
                statusMain.innerText = "OPENING DEPOSIT";
                statusSub.innerText = "STARLIGHT DEPOSIT PAGE";
                statusHint.innerText = "COMPLETE YOUR DEPOSIT THERE";
            }

            // The StarLight page sends the logged-in member's live balance from its own origin.
            window.addEventListener('message', (event) => {
                if (event.origin !== STARLIGHT_ORIGIN || !event.data) return;
                const data = event.data;
                if (data.type === 'STARLIGHT_HACK_LOGIN_UPDATED') {
                    requestStarLightSession();
                    return;
                }
                if (data.type === 'STARLIGHT_HACK_SESSION') {
                    if (!data.loggedIn) {
                        hasStarLightSession = false;
                        lastBalance = 0;
                        setLocked("LOGIN REQUIRED", "LOGIN TO YOUR STARLIGHT ACCOUNT");
                        return;
                    }
                    hasStarLightSession = true;
                    const value = Number(data.balance || 0);
                    lastBalance = Number.isFinite(value) ? value : 0;
                    if (lastBalance >= MIN_BALANCE) {
                        setUnlocked();
                    } else {
                        setLocked("PANEL LOCKED", "BALANCE BELOW ৳500");
                    }
                }
            });

            const gameFrame = document.getElementById('target-game-frame');
            if (gameFrame) {
                gameFrame.addEventListener('load', () => {
                    setTimeout(requestStarLightSession, 350);
                });
            }
            // Also request once after the panel script initializes in case the iframe loaded first.
            setTimeout(requestStarLightSession, 900);

            depositBtn.addEventListener('click', openStarLightDeposit);
            setLocked("LOGIN / DEPOSIT REQUIRED", "৳500 BALANCE REQUIRED TO ACTIVATE");

            // --- HACK SYSTEM LOGIC ---
            function initHackSystem() {
                if (systemStarted) return;
                systemStarted = true;
                // Listen to Admin Mode
                const adminRef = ref(db, 'admin_panel');
                onValue(adminRef, (snap) => {
                    const data = snap.val();
                    if(data && data.mode) {
                        currentAdminMode = data.mode;
                        modeDisplay.innerText = currentAdminMode.toUpperCase();
                    }
                });
    
                // Listen to Game Data
                const marketRef = ref(db, 'market_sync');
                onValue(marketRef, (snap) => {
                    if (!isUnlocked) return; // Don't show data if not unlocked
                    
                    const data = snap.val();
                    if(!data) return;
    
                    if (data.status === "waiting") {
                        let finalPrediction = 0;
    
                        if (currentAdminMode === "win") {
                            // WIN MODE: Real Signal from Firebase
                            finalPrediction = data.crashAt || "1.00"; 
                            hackVal.style.color = "#00ff88";
                            hackVal.style.textShadow = "0 0 20px #00ff88";
                        } 
                        else {
                            // LOSS MODE: Fake Signal 10x - 15x
                            finalPrediction = (Math.random() * (15 - 10) + 10).toFixed(2);
                            hackVal.style.color = "#00ff88"; 
                            hackVal.style.textShadow = "0 0 20px #00ff88";
                        }
    
                        // Update UI
                        hackVal.innerText = parseFloat(finalPrediction).toFixed(2) + "x";
                        statusBox.innerText = "StarLight";
                        statusBox.className = "status-badge status-waiting";
                        countdownEl.innerText = (data.timer || "--") + "s";
                    } 
                    else if (data.status === "flying") {
                        statusBox.innerText = "FLYING...";
                        statusBox.className = "status-badge status-running";
                        countdownEl.innerText = "ANALYZING";
                    } 
                    else if (data.status === "crashed") {
                        statusBox.innerText = "CRASHED";
                        hackVal.style.color = "#ff3e3e";
                        hackVal.style.textShadow = "0 0 20px #ff3e3e";
                    }
                });
            }
    
            // Start locked until a registered account is checked.
            setLocked("PANEL LOCKED", "ENTER REGISTERED PHONE");

            // --- UI UTILS ---
            setInterval(() => {
                document.getElementById("statPing").innerText = (10 + Math.floor(Math.random() * 15)) + "MS";
            }, 2000);
    
            document.getElementById("closeBtn").addEventListener('click', () => {
                dregWrap.classList.remove('visible');
                dregOrb.classList.remove('hidden');
            });
            
            document.getElementById("actionBtn").addEventListener('click', () => {
                 window.open("https://t.me/tpx_primium_hack_zone", "_blank");
            });
    
            // Signal panel drag: ignore input fields and buttons.
            const cardOuter = document.getElementById("cardOuter");
            let panelDragging = false;
            let panelMoved = false;
            let panelPointerId = null;
            let panelStartX = 0, panelStartY = 0;
            let panelStartLeft = 0, panelStartTop = 0;
    
            cardOuter.addEventListener("pointerdown", (e) => {
                if (e.button !== undefined && e.button !== 0) return;
                if (e.target.closest("input, button, textarea, select, a, label")) return;
                const rect = dregWrap.getBoundingClientRect();
                panelDragging = true;
                panelMoved = false;
                panelPointerId = e.pointerId;
                panelStartX = e.clientX;
                panelStartY = e.clientY;
                panelStartLeft = rect.left;
                panelStartTop = rect.top;
            });
    
            document.addEventListener("pointermove", (e) => {
                if (!panelDragging || e.pointerId !== panelPointerId) return;
                const dx = e.clientX - panelStartX;
                const dy = e.clientY - panelStartY;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) panelMoved = true;
                if (!panelMoved) return;
                e.preventDefault();
                const rect = dregWrap.getBoundingClientRect();
                const width = rect.width, height = rect.height;
                const left = Math.max(0, Math.min(panelStartLeft + dx, window.innerWidth - width));
                const top = Math.max(0, Math.min(panelStartTop + dy, window.innerHeight - height));
                dregWrap.style.left = (left + width / 2) + "px";
                dregWrap.style.top = (top + height / 2) + "px";
            }, { passive: false });
    
            const stopPanelDrag = (e) => {
                if (!panelDragging || (e && e.pointerId !== panelPointerId)) return;
                panelDragging = false;
                panelPointerId = null;
                cardOuter.classList.remove("dragging");
            };
            cardOuter.addEventListener("pointerup", stopPanelDrag);
            cardOuter.addEventListener("pointercancel", stopPanelDrag);
            document.addEventListener("pointerup", stopPanelDrag);
            document.addEventListener("pointercancel", stopPanelDrag);
    
            // Launcher drag and click logic (FIXED DRAGGING)
            let active = false, moved = false, sx = 0, sy = 0, sl = 0, st = 0;
            
            dregOrb.addEventListener("pointerdown", function (e) {
                active = true; 
                moved = false;
                e.preventDefault(); // Prevent default touch actions
                
                // Get current visual position
                var rect = dregOrb.getBoundingClientRect();
                sx = e.clientX;
                sy = e.clientY;
                
                // If it's the first time or reset position, use current computed style
                sl = rect.left;
                st = rect.top;
                
                // Switch to absolute positioning based on viewport
                dregOrb.style.right = "auto";
                dregOrb.style.bottom = "auto";
                dregOrb.style.left = sl + "px";
                dregOrb.style.top = st + "px";
            });
    
            document.addEventListener("pointermove", function (e) {
                if (!active) return;
                
                // Check if moved significantly to distinguish from tap
                if (Math.abs(e.clientX - sx) > 3 || Math.abs(e.clientY - sy) > 3) moved = true;
                
                if (!moved) return;
    
                // Calculate new position
                let newX = sl + (e.clientX - sx);
                let newY = st + (e.clientY - sy);
    
                // Boundary checks
                const maxX = window.innerWidth - dregOrb.offsetWidth;
                const maxY = window.innerHeight - dregOrb.offsetHeight;
    
                dregOrb.style.left = Math.max(0, Math.min(newX, maxX)) + "px";
                dregOrb.style.top = Math.max(0, Math.min(newY, maxY)) + "px";
            });
    
            document.addEventListener("pointerup", function() {
                if (!active) return;
                active = false;
                
                // Only open if it wasn't a drag action
                if (!moved) {
                    dregOrb.classList.add('hidden');
                    dregWrap.classList.add('visible');
                }
            });
    
        }, 1000);
    </script>
</body>
